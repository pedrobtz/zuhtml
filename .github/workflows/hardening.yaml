# Gates that R CMD check cannot express. Each gate runs next to its canary:
# a gate counts once it has been seen to fail, so every run also proves the
# gate can still see what it guards against. See .agents/roadmap.md.
#
# Stage 1 added the vendor and lint gates, Stage 2 the sanitizers, Stage 3
# the tree-construction conformance gate, Stage 6 the selector fuzz target;
# Stage 8 adds the parse and round-trip targets and a nightly long run.
#
# paths-ignore skips the workflow for prose-only changes. GitHub applies it
# only when every changed file matches, so a commit touching both a .md file
# and src/ still runs.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'

name: hardening

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    name: vendored Gumbo is upstream plus the patch series
    steps:
      - uses: actions/checkout@v6
      - name: re-derive src/vendor/gumbo from the pinned archive
        run: ./tools/verify-vendor
      - name: canary - leaving a patch out must fail verification
        run: ./tools/verify-vendor --canary

  lint:
    runs-on: ubuntu-latest
    name: strict warnings and no stdio symbols
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: project-owned code is warning-free; the .so imports no stdio
        run: CC=clang ./tools/run-lint
      - name: canary - reversing patch 0002 must trip the symbol check
        run: ./tools/run-lint --canary

  sanitizers:
    runs-on: ubuntu-latest
    name: ASan + UBSan + LSan over the parse seam
    steps:
      - uses: actions/checkout@v6
      - name: fault injection at every allocation index, limits, canaries
        # LeakSanitizer is unavailable on macOS, so this Linux job is the only
        # place a block the abort path forgets is actually caught.
        run: CC=clang ASAN_OPTIONS=detect_leaks=1 ./tools/run-sanitizers

  conformance:
    runs-on: ubuntu-latest
    name: html5lib tree-construction conformance and round trip
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: every case passes or is an adjudicated deviation
        run: ./tools/run-conformance
      - name: canary - a corrupted rendering must fail every case
        run: ./tools/run-conformance --canary
      - name: canary - a corrupted serialization must fail the round trip
        run: ./tools/run-conformance --canary-serialize

  fuzz:
    runs-on: ubuntu-latest
    name: fuzz
    steps:
      - uses: actions/checkout@v6
      # The corpus libFuzzer grows is cached, not committed. A fresh key per
      # run, restored from the newest earlier one, lets fuzzing time
      # accumulate across runs instead of restarting from the seeds.
      - name: restore the grown corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/zuhtml/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: fuzz every target for 60 s
        # tools/run-fuzz first requires fuzz/fuzz_canary.c to crash, and
        # exits 2 if it does not, so a green step means a crash would have
        # been seen.
        run: ZUH_FUZZ_CORPUS="$HOME/.cache/zuhtml/fuzz-corpus" CC=clang ./tools/run-fuzz 60
      - name: upload any findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
