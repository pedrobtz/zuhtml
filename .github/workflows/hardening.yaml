# Gates that R CMD check cannot express. Each gate runs next to its canary:
# a gate counts once it has been seen to fail, so every run also proves the
# gate can still see what it guards against. See .agents/roadmap.md.
#
# The vendor and lint gates (Stage 1), sanitizers (Stage 2), tree-
# construction conformance and the round trip (Stages 3 and 5), and fuzzing
# of selectors, parsing and the round trip (Stages 6 and 8), with a long
# nightly fuzz run.
#
# Gating follows ci.md: the `changes` job (r-actions' changes.yml) decides
# from the changed files and the labels, and every other job needs it. It
# replaces a paths-ignore list, which followed none of the labels.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Weekly, Saturdays: the long fuzz run. The per-push budget is small.
    - cron: "14 5 * * 6"
  workflow_dispatch:

name: hardening

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The gate for every job below. Label-tested first, so a `ci:docs` or
  # `ci:minimal` pull request takes no runner at all.
  changes:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:hardening'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: hardening
      profile: auto

  vendor:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: vendored Gumbo is upstream plus the patch series
    steps:
      - uses: actions/checkout@v6
      - name: re-derive src/vendor/gumbo from the pinned archive
        run: ./tools/verify-vendor
      - name: canary - leaving a patch out must fail verification
        run: ./tools/verify-vendor --canary

  lint:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: strict warnings and no stdio symbols
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: project-owned code is warning-free; the .so imports no stdio
        run: CC=clang ./tools/run-lint
      - name: canaries - a deliberate warning, and patch 0002 reversed
        run: CC=clang ./tools/run-lint --canary

  sanitizers:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: ASan + UBSan + LSan over the parse seam
    steps:
      - uses: actions/checkout@v6
      - name: fault injection at every allocation index, limits, canaries
        # LeakSanitizer is unavailable on macOS, so this Linux job is the only
        # place a block the abort path forgets is actually caught.
        run: CC=clang ASAN_OPTIONS=detect_leaks=1 ./tools/run-sanitizers

  conformance:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: html5lib tree-construction conformance and round trip
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: every case passes or is an adjudicated deviation
        run: ./tools/run-conformance
      - name: canary - a corrupted rendering must fail every case
        run: ./tools/run-conformance --canary
      - name: canary - a corrupted serialization must fail the round trip
        run: ./tools/run-conformance --canary-serialize

  fuzz:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: fuzz
    steps:
      - uses: actions/checkout@v6
      # The corpus libFuzzer grows is cached, not committed. A fresh key per
      # run, restored from the newest earlier one, lets fuzzing time
      # accumulate across runs instead of restarting from the seeds.
      - name: restore the grown corpus
        uses: actions/cache@v6
        with:
          path: ~/.cache/zuhtml/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: fuzz every target (20 s each; 60 s full; 30 min scheduled)
        # tools/run-fuzz first requires fuzz/fuzz_canary.c to crash, and
        # exits 2 if it does not, so a green step means a crash would have
        # been seen. ci.md keeps fuzzing beyond a minute out of the quick
        # profile, so a quick pull request gives each of the three 20 s.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then SECS=1800
          elif [ "${{ needs.changes.outputs.profile }}" = "full" ]; then SECS=60
          else SECS=20; fi
          ZUH_FUZZ_CORPUS="$HOME/.cache/zuhtml/fuzz-corpus" CC=clang ./tools/run-fuzz "$SECS"
      - name: upload any findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
