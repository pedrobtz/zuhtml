# The external HTML corpus: real pages from other projects, read to find
# what the parser and extractors get wrong. See tools/corpus/README.md.
#
# Separate from R-CMD-check.yaml on purpose: it fetches 52 MB of other
# projects' fixtures over the network, which the package's own checks must
# never depend on. Nothing here ships: tools/ is excluded by .Rbuildignore.
# One platform is enough; what the parser makes of a page does not vary by
# operating system.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

name: corpus

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The gate for every job below. Label-tested first, so a `ci:docs` or
  # `ci:minimal` pull request takes no runner at all.
  changes:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:corpus'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: corpus
      profile: auto

  corpus:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: external HTML corpus
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      # checksums.sha256 determines files/ exactly, so it is the cache key.
      # restore-keys lets an older corpus come back as a starting point,
      # which is safe because fetch re-downloads any file whose checksum
      # does not match.
      - name: cache the corpus
        uses: actions/cache@v4
        with:
          path: tools/corpus/files
          key: html-corpus-${{ hashFiles('tools/corpus/checksums.sha256') }}
          restore-keys: html-corpus-
      - name: fetch and verify
        run: tools/corpus/fetch
      - name: every outcome matches the recorded baseline
        run: tools/corpus/run
      - name: canary - an altered baseline must be reported
        run: tools/corpus/run --canary
