# Keeps the commit-pinned pedrobtz/r-actions references (coverage,
# cran-release) and the other actions current: each bump is a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      r-actions:
        patterns:
          - "pedrobtz/r-actions*"
